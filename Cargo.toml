[package]
name = "wt"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Gives each git worktree its own byte-copied development databases and web port"
repository = "https://github.com/nielsonrolim/wt"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dialoguer = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/wt-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
