# A Rails app with Postgres in docker compose and Active Storage on disk.
# The source (<project>-postgres-1), its volume and its image/command/env are
# all read from the running compose container.

[app]
copy = ["storage"]   # Active Storage blobs the cloned database points at
# Untracked files you edit in the main checkout and want every worktree to follow:
# refresh = [".claude/agents"]

[services.postgres]
# database = "myapp_development"
# check_sql = "select count(*) from schema_migrations"   # proves the schema survived the copy

[hooks]
setup = [
  ["bundle", "install"],
  ["bun", "install"],
]
after_services = [
  ["bin/rails", "db:prepare"],
]
